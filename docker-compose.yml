services:
  server:
    build: ./server
    ports: ["5000:5000"]
    env_file: ./server/.env
    depends_on: [mongo]
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    ports: ["5173:80"]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
volumes:
  mongo_data:
